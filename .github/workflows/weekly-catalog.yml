name: Weekly TVBox catalog

on:
  schedule:
    # Every Tuesday at 03:17 UTC; avoid the top of the hour.
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-tvbox-catalog
  cancel-in-progress: false

jobs:
  discover-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg for explicitly authorized playback tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Discover and validate public catalog entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_catalog.py

      - name: Commit README and catalog only when changed
        run: |
          if git diff --quiet -- README.md sources/catalog.json; then
            echo "No catalog changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md sources/catalog.json
          git commit -m "chore: refresh TVBox catalog"
          git push
