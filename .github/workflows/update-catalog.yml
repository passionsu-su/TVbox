name: Update TVbox repository and resource catalogs

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources/repositories.json"
      - "scripts/**"
      - ".github/workflows/update-catalog.yml"

permissions:
  contents: write

concurrency:
  group: update-tvbox-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate resource discovery code
        run: |
          python -m py_compile scripts/update_catalog.py scripts/discover_resources.py
          cd scripts
          python -m unittest -v test_resource_catalog.py

      - name: Refresh public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_catalog.py

      - name: Discover and validate resource files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_resources.py

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/repositories.json catalog/resources.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git commit -m "chore: refresh repository and resource catalogs"
          git push
