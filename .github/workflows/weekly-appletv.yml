name: Weekly Apple TV IPTV check

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00 北京时间
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-appletv
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check IPTV sources and rebuild Apple TV README
        run: |
          python scripts/check_iptv.py || echo "IPTV check failed, keep last result"
          python scripts/build_appletv.py
      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add appletv docs/appletv
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: 每周 Apple TV 直播源检测 $(date -u +%F)"
          git pull --rebase
          git push
